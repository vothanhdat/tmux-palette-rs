# tmux config for the recorded demo. setup.sh loads it on a private socket
# (`tmux -L palette-demo`) and binds the palette keys with absolute paths.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 5000
set -g focus-events on

# Status bar — quiet, with the one key the viewer needs to know.
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#181825,fg=#a6adc8"
set -g status-left-length 30
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[bg=#181825] "
set -g window-status-format "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[fg=#cdd6f4,bold] #I #W "
set -g status-right-length 60
set -g status-right "#[fg=#6c7086]palette #[fg=#11111b,bg=#f9e2af,bold] ⌃ Space #[bg=#181825]  "

# Pane titles on the borders, so the names the palette shows are visible too.
set -g pane-border-status top
set -g pane-border-format "#[fg=#6c7086] #{pane_title} "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines heavy
set -g message-style "bg=#181825,fg=#f9e2af"
