<!doctype html>
<!--
  The still layers of the vertical short, rendered to PNG by make.sh with
  headless Chromium. The URL hash picks the layer:

    #bg          backdrop: glow and the terminal's shadow
    #cap=N       caption for scene N (transparent, faded in over the clip)
    #mask        rounded-corner alpha mask for the terminal clip
    #outro       closing card

  Fonts are the system's Inter and JetBrainsMono Nerd Font Mono. Colors are
  Catppuccin Mocha, to match the recorded terminal. The terminal slot below
  must match SLOT_* in make.sh.

  Layout keeps clear of the apps' own overlays: their top bar (top ~150px),
  their buttons down the right edge, and the caption text along the bottom
  (bottom ~450px). The terminal sits up top; the caption is centered on the
  lower third, where it reads best.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --crust: #11111b; --mantle: #181825; --base: #1e1e2e;
    --s0: #313244; --s1: #45475a; --ov0: #6c7086;
    --sub: #a6adc8; --text: #cdd6f4;
    --mauve: #cba6f7; --pink: #f5c2e7; --blue: #89b4fa; --yellow: #f9e2af; --green: #a6e3a1;
    --slot-x: 24px; --slot-y: 150px; --slot-w: 1032px; --slot-h: 1000px; --slot-r: 14px;
    --mono: "JetBrainsMono Nerd Font Mono", "JetBrains Mono", monospace;
    --sans: "Inter", system-ui, sans-serif;
    --display: "Inter Display", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; display: none; }
  body[data-layer="bg"] #bg, body[data-layer="cap"] #cap,
  body[data-layer="outro"] #outro { display: block; }
  body[data-layer="mask"] #mask { display: block; }
  body[data-layer="mask"] { width: 1032px; height: 1000px; }

  /* ---- backdrop ---------------------------------------------------------- */
  .backdrop {
    position: absolute; inset: 0; background: var(--crust);
    background-image:
      radial-gradient(900px 520px at 50% 68%, rgb(203 166 247 / 0.2), transparent 70%),
      radial-gradient(800px 700px at 0% 0%, rgb(137 180 250 / 0.14), transparent 70%),
      radial-gradient(800px 700px at 100% 100%, rgb(245 194 231 / 0.08), transparent 70%);
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.35;
    background-image:
      linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: linear-gradient(to bottom, transparent 55%, black 72%, transparent 95%);
  }
  .shadow {
    position: absolute; left: var(--slot-x); top: var(--slot-y);
    width: var(--slot-w); height: var(--slot-h); border-radius: var(--slot-r);
    background: var(--base);
    box-shadow: 0 40px 90px rgb(0 0 0 / 0.65), 0 0 0 1.5px rgb(203 166 247 / 0.28),
                0 0 120px rgb(203 166 247 / 0.12);
  }
  .logo {
    width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--mauve), var(--blue));
    color: var(--crust); font: 800 30px/1 var(--mono);
    box-shadow: 0 8px 24px rgb(203 166 247 / 0.35);
  }

  /* ---- caption ----------------------------------------------------------- */
  .caption {
    position: absolute; left: 110px; right: 110px; top: 1172px; height: 280px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; text-align: center;
  }
  .brand {
    display: flex; align-items: center; gap: 14px;
    font: 700 28px/1 var(--sans); letter-spacing: -0.3px; color: var(--sub);
  }
  .brand .logo { width: 40px; height: 40px; border-radius: 11px; font-size: 20px; box-shadow: none; }
  .dots { display: flex; gap: 10px; margin-left: 14px; }
  .dots i { width: 12px; height: 12px; border-radius: 6px; background: var(--s1); }
  .dots i.done { background: rgb(203 166 247 / 0.45); }
  .dots i.on { width: 34px; background: var(--mauve); }
  h1 {
    font: 800 66px/1.06 var(--display); letter-spacing: -1.8px; color: var(--text);
    text-wrap: balance;
  }
  em {
    font-style: normal;
    background: linear-gradient(90deg, var(--mauve), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px;
    font: 500 32px/1.2 var(--sans); color: var(--sub);
  }
  kbd {
    display: inline-flex; align-items: center; height: 52px; padding: 0 16px;
    border-radius: 12px; background: var(--s0); color: var(--yellow);
    border: 2px solid var(--s1); border-bottom-width: 6px;
    font: 700 28px/1 var(--mono);
  }
  .plus { color: var(--ov0); font-weight: 700; }
  .sub .gap { width: 8px; }

  /* ---- mask -------------------------------------------------------------- */
  #mask { background: #000; }
  #mask div { position: absolute; inset: 0; border-radius: var(--slot-r); background: #fff; }

  /* ---- outro ------------------------------------------------------------- */
  #outro .center {
    position: absolute; left: 110px; right: 110px; top: 250px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  #outro .logo { width: 168px; height: 168px; border-radius: 44px; font-size: 84px; }
  #outro h2 {
    margin-top: 52px; font: 800 118px/1 var(--display); letter-spacing: -4px;
  }
  #outro .tagline { margin-top: 28px; font: 500 46px/1.25 var(--sans); color: var(--sub); }
  .chips { margin-top: 48px; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .chips span {
    padding: 13px 22px; border-radius: 999px; background: rgb(49 50 68 / 0.75);
    border: 2px solid var(--s1); font: 600 28px/1 var(--sans); color: var(--text);
  }
  .install {
    margin-top: 76px; width: 100%; border-radius: 22px; padding: 30px 34px;
    background: var(--base); border: 2px solid var(--s0); text-align: left;
    box-shadow: 0 30px 70px rgb(0 0 0 / 0.5);
  }
  .install .label { font: 500 26px/1 var(--mono); color: var(--ov0); }
  .install pre { margin-top: 20px; font: 500 30px/1.5 var(--mono); color: var(--text); white-space: pre-wrap; }
  .install .k { color: var(--mauve); } .install .s { color: var(--green); } .install .c { color: var(--ov0); }
  .star {
    margin-top: 70px; display: flex; align-items: center; gap: 18px;
    font: 700 40px/1 var(--sans);
  }
  .star .url { font: 600 34px/1 var(--mono); color: var(--sub); margin-top: 18px; }
  .star svg { width: 46px; height: 46px; fill: var(--yellow); }
</style>
</head>
<body>
  <div id="bg" class="layer">
    <div class="backdrop"></div>
    <div class="grid"></div>
    <div class="shadow"></div>
  </div>

  <div id="cap" class="layer">
    <div class="caption">
      <div class="brand"><div class="logo">❯_</div>tmux-palette<div class="dots"></div></div>
      <h1></h1>
      <div class="sub"></div>
    </div>
  </div>

  <div id="mask" class="layer"><div></div></div>

  <div id="outro" class="layer">
    <div class="backdrop"></div>
    <div class="grid"></div>
    <div class="center">
      <div class="logo">❯_</div>
      <h2><em>tmux-palette</em></h2>
      <div class="tagline">A fuzzy command palette for tmux</div>
      <div class="chips"><span>⚡ One Rust binary</span><span>🔌 TPM plugin</span><span>📖 Open source</span></div>
      <div class="install">
        <div class="label"># ~/.tmux.conf</div>
        <pre><span class="k">set</span> -g @plugin <span class="s">'vothanhdat/tmux-palette-rs'</span>
<span class="c"># then press</span> <span class="k">Ctrl</span>+<span class="k">Space</span></pre>
      </div>
      <div class="star">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
        Star it on GitHub
      </div>
      <div class="star url">github.com/vothanhdat/tmux-palette-rs</div>
    </div>
  </div>

<script>
  // One entry per recorded scene, in order (demo/short/<n>-*.tape).
  const SCENES = [
    { h: "Stop memorizing <em>tmux keybindings</em>",
      sub: "<kbd>Ctrl</kbd><span class=plus>+</span><kbd>Space</kbd><span class=gap></span>one key opens everything" },
    { h: "Jump to any pane by <em>typing its name</em>",
      sub: "fuzzy search across every session" },
    { h: "Every pane at a glance, with a <em>live preview</em>",
      sub: "Find Pane · filter by title, command or path" },
    { h: "Every tmux command, <em>explained</em> as you type",
      sub: "<kbd>prefix</kbd><kbd>:</kbd><span class=gap></span>Tab completes · flags described" },
    { h: "Switch themes with a <em>live preview</em>",
      sub: "13 built in, or bring your own" },
    { h: "Build your own palette from <em>any shell command</em>",
      sub: "one small JSON file · here: git branches" },
  ];

  const hash = location.hash.slice(1);
  const [layer, arg] = hash.split("=");
  document.body.dataset.layer = layer || "bg";
  if (layer === "cap") {
    const n = Number(arg), s = SCENES[n - 1];
    document.querySelector("h1").innerHTML = s.h;
    document.querySelector(".sub").innerHTML = s.sub;
    document.querySelector(".dots").innerHTML = SCENES
      .map((_, i) => `<i class="${i + 1 === n ? "on" : i + 1 < n ? "done" : ""}"></i>`).join("");
  }
</script>
</body>
</html>
